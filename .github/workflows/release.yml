name: Build Release (Windows + macOS + Android + iOS)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Package app
        run: npm run pack

      - name: Zip clean package
        shell: pwsh
        run: |
          $app = "release/自由发-win32-x64"
          Remove-Item -Recurse -Force "$app/resources/app/data" -ErrorAction SilentlyContinue
          if (Test-Path "release/freeflow-win64") { Remove-Item -Recurse -Force "release/freeflow-win64" }
          Copy-Item -Recurse "$app" "release/freeflow-win64"
          Compress-Archive -Path "release/freeflow-win64" -DestinationPath "release/freeflow-win64.zip" -CompressionLevel Optimal

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7
          name: 自由发 v1.7 · Windows + macOS + Android + iOS 四端
          files: release/freeflow-win64.zip
          body: |
            自由发 v1.7 · 全平台分发工具（Windows + macOS + Android + iOS 四端）

            v1.7 更新：编辑器排版大升级（撤销/重做、字号、字色、底色、行高、对齐、表格、引用、代码块）；小红书按内容自动选择图文/长文章/视频/音频入口，音频笔记支持本地上传自动投递；修复 B 站专栏 Markdown 乱码（改富文本发布）与 CSDN 正文填充丢失

            Windows：下载 freeflow-win64.zip，解压后双击 自由发\自由发.exe
            macOS：Apple 芯片下 freeflow-mac-arm64.*，Intel 下 freeflow-mac-x64.*（zip 解压后拖进「应用程序」，或双击 dmg）
            Android：下载 freeflow-android.apk，允许「未知来源安装」后直接安装
            iOS（v1.6 新增）：下载 freeflow-ios.ipa，为免签包，需用 AltStore / Sideloadly 免费自签后安装（7 天需重签，详见 README「苹果手机版」）

            - 53 个平台（国内 38 / 海外 15）
            - 富文本 / Markdown 双模式编辑器，按平台自动转换
            - 网页图片直接粘贴（自动下载进素材库）
            - 平台数据看板（粉丝/阅读/点赞趋势图）
            - 文章搜索、复制、删除；任务重试、删除、清空历史
            - 登录态三重检测，过期自动提示扫码
            - 手机版为「随身编辑器 + 遥控器」：连同一局域网电脑（点状态条填地址，如 192.168.1.10:8917），账号与一键发布走电脑引擎
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-14
    needs: build-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Package arm64 (Apple Silicon)
        run: npm run pack:mac

      - name: Package x64 (Intel)
        run: npm run pack:mac-intel

      - name: Create zip + dmg
        run: |
          for arch in arm64 x64; do
            app="release/自由发-darwin-$arch/自由发.app"
            rm -rf "$app/Contents/Resources/app/data"
            ditto -c -k --keepParent "$app" "release/freeflow-mac-$arch.zip"
            hdiutil create -volname "自由发" -srcfolder "$app" -ov -format UDZO "release/freeflow-mac-$arch.dmg"
          done
          ls -lh release/*.zip release/*.dmg

      - name: Publish macOS assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7
          name: 自由发 v1.7 · Windows + macOS + Android + iOS 四端
          files: |
            release/freeflow-mac-arm64.zip
            release/freeflow-mac-arm64.dmg
            release/freeflow-mac-x64.zip
            release/freeflow-mac-x64.dmg
          body: |
            自由发 v1.7 · 全平台分发工具（Windows + macOS + Android + iOS 四端）

            v1.7 更新：编辑器排版大升级（撤销/重做、字号、字色、底色、行高、对齐、表格、引用、代码块）；小红书按内容自动选择图文/长文章/视频/音频入口，音频笔记支持本地上传自动投递；修复 B 站专栏 Markdown 乱码（改富文本发布）与 CSDN 正文填充丢失

            Windows：下载 freeflow-win64.zip，解压后双击 自由发\自由发.exe
            macOS：Apple 芯片下 freeflow-mac-arm64.*，Intel 下 freeflow-mac-x64.*（zip 解压后拖进「应用程序」，或双击 dmg）
            Android：下载 freeflow-android.apk，允许「未知来源安装」后直接安装
            iOS（v1.6 新增）：下载 freeflow-ios.ipa，为免签包，需用 AltStore / Sideloadly 免费自签后安装（7 天需重签，详见 README「苹果手机版」）

            - 53 个平台（国内 38 / 海外 15）
            - 富文本 / Markdown 双模式编辑器，按平台自动转换
            - 网页图片直接粘贴（自动下载进素材库）
            - 平台数据看板（粉丝/阅读/点赞趋势图）
            - 文章搜索、复制、删除；任务重试、删除、清空历史
            - 登录态三重检测，过期自动提示扫码
            - 手机版为「随身编辑器 + 遥控器」：连同一局域网电脑（点状态条填地址，如 192.168.1.10:8917），账号与一键发布走电脑引擎
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    needs: build-macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Sync web assets to Android project
        run: npx cap sync android

      - name: Generate signing key
        run: keytool -genkeypair -v -storetype PKCS12 -keystore freeflow.keystore -alias freeflow -keyalg RSA -keysize 2048 -validity 36500 -storepass freeflow2026 -keypass freeflow2026 -dname "CN=Freeflow, O=Freeflow, L=Shanghai, C=CN"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PRELEASE_STORE_FILE=$GITHUB_WORKSPACE/freeflow.keystore -PRELEASE_STORE_PASSWORD=freeflow2026 -PRELEASE_KEY_ALIAS=freeflow -PRELEASE_KEY_PASSWORD=freeflow2026 --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk freeflow-android.apk

      - name: Publish Android asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7
          name: 自由发 v1.7 · Windows + macOS + Android + iOS 四端
          files: freeflow-android.apk
          body: |
            自由发 v1.7 · 全平台分发工具（Windows + macOS + Android + iOS 四端）

            v1.7 更新：编辑器排版大升级（撤销/重做、字号、字色、底色、行高、对齐、表格、引用、代码块）；小红书按内容自动选择图文/长文章/视频/音频入口，音频笔记支持本地上传自动投递；修复 B 站专栏 Markdown 乱码（改富文本发布）与 CSDN 正文填充丢失

            Windows：下载 freeflow-win64.zip，解压后双击 自由发\自由发.exe
            macOS：Apple 芯片下 freeflow-mac-arm64.*，Intel 下 freeflow-mac-x64.*（zip 解压后拖进「应用程序」，或双击 dmg）
            Android：下载 freeflow-android.apk，允许「未知来源安装」后直接安装
            iOS（v1.6 新增）：下载 freeflow-ios.ipa，为免签包，需用 AltStore / Sideloadly 免费自签后安装（7 天需重签，详见 README「苹果手机版」）

            - 53 个平台（国内 38 / 海外 15）
            - 富文本 / Markdown 双模式编辑器，按平台自动转换
            - 网页图片直接粘贴（自动下载进素材库）
            - 平台数据看板（粉丝/阅读/点赞趋势图）
            - 文章搜索、复制、删除；任务重试、删除、清空历史
            - 登录态三重检测，过期自动提示扫码
            - 手机版为「随身编辑器 + 遥控器」：连同一局域网电脑（点状态条填地址，如 192.168.1.10:8917），账号与一键发布走电脑引擎
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    runs-on: macos-latest
    needs: build-macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Create iOS project and sync web assets
        run: npx cap add ios

      - name: Allow plain-HTTP access to local desktop engine
        run: node tools/patch-info-plist.js ios/App/App/Info.plist

      - name: Build unsigned release archive
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath ios/build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p ios/Payload
          cp -R "ios/build/App.xcarchive/Products/Applications/App.app" ios/Payload/
          cd ios && zip -qry ../freeflow-ios.ipa Payload

      - name: Publish iOS asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7
          name: 自由发 v1.7 · Windows + macOS + Android + iOS 四端
          files: freeflow-ios.ipa
          body: |
            自由发 v1.7 · 全平台分发工具（Windows + macOS + Android + iOS 四端）

            v1.7 更新：编辑器排版大升级（撤销/重做、字号、字色、底色、行高、对齐、表格、引用、代码块）；小红书按内容自动选择图文/长文章/视频/音频入口，音频笔记支持本地上传自动投递；修复 B 站专栏 Markdown 乱码（改富文本发布）与 CSDN 正文填充丢失

