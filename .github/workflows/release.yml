name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Package app
        run: npm run pack

      - name: Zip clean package
        shell: pwsh
        run: |
          $app = "release/自由发-win32-x64"
          Remove-Item -Recurse -Force "$app/resources/app/data" -ErrorAction SilentlyContinue
          if (Test-Path "release/freeflow-win64") { Remove-Item -Recurse -Force "release/freeflow-win64" }
          Copy-Item -Recurse "$app" "release/freeflow-win64"
          Compress-Archive -Path "release/freeflow-win64" -DestinationPath "release/freeflow-win64.zip" -CompressionLevel Optimal

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3
          name: 自由发 v1.3 · 双模式编辑器 + 数据看板
          files: release/freeflow-win64.zip
          body: |
            Windows 免安装版（解压即用，解压后双击 自由发\自由发.exe）。

            - 53 个平台（国内 38 / 海外 15）
            - 富文本 / Markdown 双模式编辑器，按平台自动转换
            - 网页图片直接粘贴（自动下载进素材库）
            - 平台数据看板（粉丝/阅读/点赞趋势图）
            - 文章搜索、复制、删除；任务重试、删除、清空历史
            - 登录态三重检测，过期自动提示扫码

            数据保存在程序目录 data 文件夹，请放在可写目录。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
