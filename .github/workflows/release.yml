  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Sync web assets to Android project
        run: npx cap sync android

      - name: Generate signing key
        run: keytool -genkeypair -v -storetype PKCS12 -keystore freeflow.keystore -alias freeflow -keyalg RSA -keysize 2048 -validity 36500 -storepass freeflow2026 -keypass freeflow2026 -dname "CN=Freeflow, O=Freeflow, L=Shanghai, C=CN"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PRELEASE_STORE_FILE=$GITHUB_WORKSPACE/freeflow.keystore -PRELEASE_STORE_PASSWORD=freeflow2026 -PRELEASE_KEY_ALIAS=freeflow -PRELEASE_KEY_PASSWORD=freeflow2026 --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk freeflow-android.apk

      - name: Publish Android asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.3
          name: 自由发 v1.9.3 · Windows + macOS + Android + iOS 四端
          files: freeflow-android.apk
          body: |
