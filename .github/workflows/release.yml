name: Build Release (Windows + macOS + Android + iOS)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Download bundled browser core
        env:
          PLAYWRIGHT_BROWSERS_PATH: browsers
        run: |
          npx playwright install chromium
          Get-ChildItem browsers -Directory | Where-Object { $_.Name -like 'chromium_headless_shell*' } | Remove-Item -Recurse -Force
        shell: pwsh

      - name: Package app
        run: npm run pack

      - name: Zip clean package
        shell: pwsh
        run: |
          $app = "release/自由发-win32-x64"
          Remove-Item -Recurse -Force "$app/resources/app/data" -ErrorAction SilentlyContinue
          if (Test-Path "release/freeflow-win64") { Remove-Item -Recurse -Force "release/freeflow-win64" }
          Copy-Item -Recurse "$app" "release/freeflow-win64"
          Compress-Archive -Path "release/freeflow-win64" -DestinationPath "release/freeflow-win64.zip" -CompressionLevel Optimal

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.3
          name: 自由发 v1.9.3 · Windows + macOS + Android + iOS 四端
          files: release/freeflow-win64.zip
          body: |
            自由发 v1.9.3 · 全平台分发工具（Windows + macOS + Android + iOS 四端）

            v1.9.3 更新：消息中心重构——改为解析平台页面真实接口数据（支持会话 lastMsg / B站 account_info+last_msg 等字段族），修复回复框被错误跳过导致回复必然失败的问题，回复失败自动留草稿；数据采集接入后台接口字段映射（粉丝/阅读/点赞/评论/分享，支持万/k 单位），修复知乎/CSDN/博客园等创作中心识别；编辑器修复撤销栈跨文章串内容、空格输入异常、保存竞态与发布重复提交。
            v1.9.2 更新：内置浏览器——登录 / 发布一律改用程序自带的 Chromium 内核，不再依赖系统 Chrome，修复「没装 Chrome 时报 browserType.launchPersistentContext: Chromium not found」的问题，安装包解压即用；「安装浏览器内核」按钮也改为下载到程序自带目录，从源码运行同样生效。
            v1.9.1 更新：统一消息中心——聚合各平台私信 / 评论 / 系统通知，按平台/类型/未读筛选，可直接回复并同步发送到源平台（发送前显示目标平台和账号，失败自动留草稿可重试，不支持的平台明确提示）；顶栏中英文一键切换；软件内「检查更新」+ 每次启动自动检测 GitHub Release，有新版弹窗展示更新内容；数据采集改走各平台创作数据中心（知乎 / CSDN / B站等 16 个平台）；趋势图支持按平台切换；大模型生成结果预览 / 源码双视图。
            v1.9 更新：「我的大模型」模块——左侧栏导入自己的大模型辅助创作，内置 OpenAI / DeepSeek / 通义千问 / 智谱 GLM / Kimi / 豆包 / Gemini / Ollama 本地 / 硅基流动 9 个厂商预设（也可自定义任意 OpenAI 兼容端点），支持连通测试、拉模型列表、本地素材当上下文、生成结果一键存草稿箱去发布；一键检测登录、立即/定时发布拆成两个按钮；修复 CSDN 富文本链接误进 Markdown 编辑器导致的乱码、百家号正文误填进标题。v1.8：全平台自动发布 + 发布前排版检查；v1.7：编辑器排版大升级、小红书多入口分流

            Windows：下载 freeflow-win64.zip，解压后双击 自由发\自由发.exe
            macOS：Apple 芯片下 freeflow-mac-arm64.*，Intel 下 freeflow-mac-x64.*（zip 解压后拖进「应用程序」，或双击 dmg）
            Android：下载 freeflow-android.apk，允许「未知来源安装」后直接安装
            iOS（v1.6 新增）：下载 freeflow-ios.ipa，为免签包，需用 AltStore / Sideloadly 免费自签后安装（7 天需重签，详见 README「苹果手机版」）

            - 53 个平台（国内 38 / 海外 15）
            - 富文本 / Markdown 双模式编辑器，按平台自动转换
            - 网页图片直接粘贴（自动下载进素材库）
            - 平台数据看板（粉丝/阅读/点赞趋势图，按平台切换）
            - 统一消息中心（各平台私信 / 评论 / 通知聚合 + 直接回复）
            - 内置浏览器内核，不装系统 Chrome 也能用
            - 消息中心/数据采集改读真实接口，编辑器撤销与空格交互修复
            - 中英文一键切换 + 软件内检查更新
            - 文章搜索、复制、删除；任务重试、删除、清空历史
            - 登录态三重检测，过期自动提示扫码
            - 手机版为「随身编辑器 + 遥控器」：连同一局域网电脑（点状态条填地址，如 192.168.1.10:8917），账号与一键发布走电脑引擎
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Download bundled browser core
        env:
          PLAYWRIGHT_BROWSERS_PATH: browsers
        run: |
          npx playwright install chromium
          rm -rf browsers/chromium_headless_shell-*

      - name: Package arm64 (Apple Silicon)
        run: npm run pack:mac

      - name: Package x64 (Intel)
        run: npm run pack:mac-intel

      - name: Create zip + dmg
        run: |
          for arch in arm64 x64; do
            app="release/自由发-darwin-$arch/自由发.app"
            rm -rf "$app/Contents/Resources/app/data"
            ditto -c -k --keepParent "$app" "release/freeflow-mac-$arch.zip"
            hdiutil create -volname "自由发" -srcfolder "$app" -ov -format UDZO "release/freeflow-mac-$arch.dmg"
          done
          ls -lh release/*.zip release/*.dmg

      - name: Publish macOS assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.3
          name: 自由发 v1.9.3 · Windows + macOS + Android + iOS 四端
          files: |
            release/freeflow-mac-arm64.zip
            release/freeflow-mac-arm64.dmg
            release/freeflow-mac-x64.zip
            release/freeflow-mac-x64.dmg
          body: |
