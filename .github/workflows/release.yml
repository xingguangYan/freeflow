            - 富文本 / Markdown 双模式编辑器，按平台自动转换
            - 网页图片直接粘贴（自动下载进素材库）
            - 平台数据看板（粉丝/阅读/点赞趋势图）
            - 文章搜索、复制、删除；任务重试、删除、清空历史
            - 登录态三重检测，过期自动提示扫码
