            v1.9.3 更新：消息中心重构——改为解析平台页面真实接口数据（支持会话 lastMsg / B站 account_info+last_msg 等字段族），修复回复框被错误跳过导致回复必然失败的问题，回复失败自动留草稿；数据采集接入后台接口字段映射（粉丝/阅读/点赞/评论/分享，支持万/k 单位），修复知乎/CSDN/博客园等创作中心识别；编辑器修复撤销栈跨文章串内容、空格输入异常、保存竞态与发布重复提交。
