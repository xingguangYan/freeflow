            macOS：Apple 芯片下 freeflow-mac-arm64.*，Intel 下 freeflow-mac-x64.*（zip 解压后拖进「应用程序」，或双击 dmg）
            Android：下载 freeflow-android.apk，允许「未知来源安装」后直接安装
            iOS（v1.6 新增）：下载 freeflow-ios.ipa，为免签包，需用 AltStore / Sideloadly 免费自签后安装（7 天需重签，详见 README「苹果手机版」）

            - 53 个平台（国内 38 / 海外 15）
            - 富文本 / Markdown 双模式编辑器，按平台自动转换
            - 网页图片直接粘贴（自动下载进素材库）
            - 平台数据看板（粉丝/阅读/点赞趋势图，按平台切换）
            - 统一消息中心（各平台私信 / 评论 / 通知聚合 + 直接回复）
            - 内置浏览器内核，不装系统 Chrome 也能用
            - 消息中心/数据采集改读真实接口，编辑器撤销与空格交互修复
            - 中英文一键切换 + 软件内检查更新
            - 文章搜索、复制、删除；任务重试、删除、清空历史
            - 登录态三重检测，过期自动提示扫码
            - 手机版为「随身编辑器 + 遥控器」：连同一局域网电脑（点状态条填地址，如 192.168.1.10:8917），账号与一键发布走电脑引擎
