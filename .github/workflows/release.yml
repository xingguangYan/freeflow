name: Build Release (Windows + macOS + Android)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Package app
        run: npm run pack

      - name: Zip clean package
        shell: pwsh
        run: |
          $app = "release/自由发-win32-x64"
          Remove-Item -Recurse -Force "$app/resources/app/data" -ErrorAction SilentlyContinue
          if (Test-Path "release/freeflow-win64") { Remove-Item -Recurse -Force "release/freeflow-win64" }
          Copy-Item -Recurse "$app" "release/freeflow-win64"
          Compress-Archive -Path "release/freeflow-win64" -DestinationPath "release/freeflow-win64.zip" -CompressionLevel Optimal

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5
          name: 自由发 v1.5 · Windows + macOS + Android 三端
          files: release/freeflow-win64.zip
          body: |
            Windows 免安装版（解压即用，解压后双击 自由发\自由发.exe）。

            - 53 个平台（国内 38 / 海外 15）
            - 富文本 / Markdown 双模式编辑器，按平台自动转换
            - 网页图片直接粘贴（自动下载进素材库）
            - 平台数据看板（粉丝/阅读/点赞趋势图）
            - 文章搜索、复制、删除；任务重试、删除、清空历史
            - 登录态三重检测，过期自动提示扫码

            数据保存在程序目录 data 文件夹，请放在可写目录。
            macOS 用户下载 freeflow-mac-*，安卓手机下载 freeflow-android.apk。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-14
    needs: build-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Package arm64 (Apple Silicon)
        run: npm run pack:mac

      - name: Package x64 (Intel)
        run: npm run pack:mac-intel

      - name: Create zip + dmg
        run: |
          for arch in arm64 x64; do
            app="release/自由发-darwin-$arch/自由发.app"
            rm -rf "$app/Contents/Resources/app/data"
            # ditto 保留 Electron Frameworks 里的符号链接，普通 zip 会破坏
            ditto -c -k --keepParent "$app" "release/freeflow-mac-$arch.zip"
            hdiutil create -volname "自由发" -srcfolder "$app" -ov -format UDZO "release/freeflow-mac-$arch.dmg"
          done
          ls -lh release/*.zip release/*.dmg

      - name: Publish macOS assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5
          name: 自由发 v1.5 · Windows + macOS + Android 三端
          files: |
            release/freeflow-mac-arm64.zip
            release/freeflow-mac-arm64.dmg
            release/freeflow-mac-x64.zip
            release/freeflow-mac-x64.dmg
          body: |
            macOS 版（Apple Silicon / Intel）：
            - arm64 = M1/M2/M3/M4 等 Apple 芯片，x64 = Intel 芯片
            - zip 解压后把「自由发」拖进「应用程序」；dmg 直接双击安装
            - 首次打开若提示「无法验证开发者」：右键点 app 选「打开」，或终端执行 xattr -cr /Applications/自由发.app
            - 建议安装 Google Chrome；没装 Chrome 时在「账号」页点「安装浏览器内核」自动下载
            - macOS 版数据存在 ~/Library/Application Support/自由发
            Windows 用户请下载 freeflow-win64.zip，安卓手机下载 freeflow-android.apk。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    needs: build-macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Sync web assets to Android project
        run: npx cap sync android

      - name: Generate signing key
        run: keytool -genkeypair -v -storetype PKCS12 -keystore freeflow.keystore -alias freeflow -keyalg RSA -keysize 2048 -validity 36500 -storepass freeflow2026 -keypass freeflow2026 -dname "CN=Freeflow, O=Freeflow, L=Shanghai, C=CN"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PRELEASE_STORE_FILE=$GITHUB_WORKSPACE/freeflow.keystore -PRELEASE_STORE_PASSWORD=freeflow2026 -PRELEASE_KEY_ALIAS=freeflow -PRELEASE_KEY_PASSWORD=freeflow2026 --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk freeflow-android.apk

      - name: Publish Android asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5
          name: 自由发 v1.5 · Windows + macOS + Android 三端
          files: freeflow-android.apk
          body: |
            安卓手机版（v1.5 新增）：下载 freeflow-android.apk，允许「未知来源安装」后直接安装。

            - 内嵌完整编辑器，手机离线也能写文章/管理素材
            - 首次打开点右上角状态条，填电脑端局域网地址（如 192.168.1.10:8917）连接电脑
            - 连上后账号、素材、一键发布全部走电脑引擎：扫码登录在电脑上完成，手机负责写内容和下发
            - 电脑端需运行 v1.5 及以上版本

            Windows 用户请下载 freeflow-win64.zip，macOS 用户下载 freeflow-mac-*。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}